name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5

      - name: Set up Helm
        uses: azure/setup-helm@1a275c3b69536ee54be43f2070a358922e12c8d4 # v4
        with:
          version: v4.2.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.0

      - name: Lint Helm chart
        run: |
          helm lint charts/sample-app \
            --values envs/dev/values.yaml \
            --set-string image.repository=example.invalid/sample-app \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm lint charts/sample-app \
            --values envs/prod/values.yaml \
            --set-string image.repository=example.invalid/sample-app \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Render Dev and Prod Helm releases
        run: |
          helm template sample-app charts/sample-app \
            --values envs/dev/values.yaml \
            --set-string image.repository=example.invalid/sample-app \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > /tmp/sample-app-dev.yaml
          helm template sample-app charts/sample-app \
            --values envs/prod/values.yaml \
            --set-string image.repository=example.invalid/sample-app \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > /tmp/sample-app-prod.yaml

      - name: Render Argo CD bootstrap resources
        run: |
          kubectl kustomize argocd/bootstrap/dev > /tmp/argocd-dev.yaml
          kubectl kustomize argocd/bootstrap/prod > /tmp/argocd-prod.yaml

      - name: Verify production rollback window
        run: |
          awk '
            /^kind: Rollout$/ { in_rollout = 1 }
            in_rollout && /^  rollbackWindow:$/ { getline; if ($0 == "    revisions: 2") found = 1 }
            END {
              if (!found) {
                print "Prod Rollout must render rollbackWindow.revisions=2" > "/dev/stderr"
                exit 1
              }
            }
          ' /tmp/sample-app-prod.yaml

      - name: Verify Stateful application contract
        run: bash tests/stateful-contract.sh
