name: validate

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    name: validate
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Install required host tools
        run: |
          sudo apt-get update
          sudo apt-get install --yes ripgrep
          rg --version

      - name: Set up Helm
        uses: azure/setup-helm@9bc31f4ebc9c6b171d7bfbaa5d006ae7abdb4310 # v5.0.1
        with:
          version: v4.2.4

      - name: Set up kubectl
        uses: azure/setup-kubectl@829323503d1be3d00ca8346e5391ca0b07a9ab0d # v5.1.0
        with:
          version: v1.36.0

      - name: Install exact yq
        run: |
          GOBIN="$RUNNER_TEMP/yq-bin" go install github.com/mikefarah/yq/v4@v4.53.6
          echo "$RUNNER_TEMP/yq-bin" >> "$GITHUB_PATH"
          "$RUNNER_TEMP/yq-bin/yq" --version | grep -Fq 'v4.53.6'

      - name: Assert compatibility pins
        run: |
          yq -e '.tooling.yq == "4.53.6" and .tooling.kubectl == "1.36.0" and .delivery.runtime.name == "mini-commerce" and .delivery.runtime.repositoryId == 1352247019 and .delivery.helmCli == "4.2.4" and .delivery.argoCdController == "3.5.2" and .delivery.argoRolloutsController == "1.9.1" and .delivery.externalSecretsChart == "2.10.0" and .delivery.gatewayApi == "1.6.0"' versions.lock.yaml

      - name: Bind changed Prod values to current DEV_READY
        if: github.event_name == 'pull_request'
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: bash scripts/verify-prod-promotion-binding.sh "$BASE_SHA"

      - name: Lint Helm chart
        run: |
          helm lint charts/mini-commerce \
            --values envs/dev/values.yaml \
            --set-string image.repository=example.invalid/mini-commerce \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
          helm lint charts/mini-commerce \
            --values envs/prod/values.yaml \
            --set-string image.repository=example.invalid/mini-commerce \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa

      - name: Render Dev and Prod Helm releases
        run: |
          helm template mini-commerce charts/mini-commerce \
            --values envs/dev/values.yaml \
            --set-string image.repository=example.invalid/mini-commerce \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > /tmp/mini-commerce-dev.yaml
          helm template mini-commerce charts/mini-commerce \
            --values envs/prod/values.yaml \
            --set-string image.repository=example.invalid/mini-commerce \
            --set-string image.digest=sha256:aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa \
            > /tmp/mini-commerce-prod.yaml

      - name: Render Argo CD bootstrap resources
        run: |
          kubectl kustomize argocd/bootstrap/dev > /tmp/argocd-dev.yaml
          kubectl kustomize argocd/bootstrap/prod > /tmp/argocd-prod.yaml

      - name: Verify External Secrets Chart authorization
        run: |
          helm repo add external-secrets https://charts.external-secrets.io
          helm template external-secrets external-secrets/external-secrets --version 2.10.0 \
            --namespace external-secrets --set installCRDs=true --set serviceMonitor.enabled=false \
            > "$RUNNER_TEMP/external-secrets-2.10.0.yaml"
          EXTERNAL_SECRETS_RENDERED_MANIFEST="$RUNNER_TEMP/external-secrets-2.10.0.yaml" \
            bash tests/bootstrap-contract.sh --case external-secrets-project

      - name: Verify production rollback window
        run: |
          awk '
            /^kind: Rollout$/ { in_rollout = 1 }
            in_rollout && /^  rollbackWindow:$/ { getline; if ($0 == "    revisions: 2") found = 1 }
            END {
              if (!found) {
                print "Prod Rollout must render rollbackWindow.revisions=2" > "/dev/stderr"
                exit 1
              }
            }
          ' /tmp/mini-commerce-prod.yaml

      - name: Install pinned kubeconform
        run: |
          GOBIN="$RUNNER_TEMP/schema-bin" go install github.com/yannh/kubeconform/cmd/kubeconform@v0.7.0
          export PATH="$RUNNER_TEMP/schema-bin:$PATH"
          export CHART_CACHE_DIR="$RUNNER_TEMP/locked-charts"
          echo "$RUNNER_TEMP/schema-bin" >> "$GITHUB_PATH"

      - name: Install locked Istio, CUE and Prometheus validation tools
        run: |
          mkdir -p "$RUNNER_TEMP/istio-bin"
          curl -fsSL "$(yq -r '.tooling.istioctl.linuxAmd64Url' versions.lock.yaml)" -o "$RUNNER_TEMP/istioctl.tgz"
          printf '%s  %s\n' "$(yq -r '.tooling.istioctl.linuxAmd64Sha256' versions.lock.yaml)" "$RUNNER_TEMP/istioctl.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/istioctl.tgz" -C "$RUNNER_TEMP/istio-bin"
          export PATH="$RUNNER_TEMP/istio-bin:$PATH"
          export CHART_CACHE_DIR="$RUNNER_TEMP/locked-charts"
          echo "$RUNNER_TEMP/istio-bin" >> "$GITHUB_PATH"
          curl -fsSL "$(yq -r '.tooling.cue.linuxAmd64Url' versions.lock.yaml)" -o "$RUNNER_TEMP/cue.tgz"
          printf '%s  %s\n' "$(yq -r '.tooling.cue.linuxAmd64Sha256' versions.lock.yaml)" "$RUNNER_TEMP/cue.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/cue.tgz" -C "$RUNNER_TEMP/istio-bin" cue
          curl -fsSL https://github.com/prometheus/prometheus/releases/download/v3.14.0/prometheus-3.14.0.linux-amd64.tar.gz -o "$RUNNER_TEMP/prometheus.tgz"
          printf '%s  %s\n' f665c6da19eb7ba399c915d30c7d9793c9b417bf8a749b504bc470678631478d "$RUNNER_TEMP/prometheus.tgz" | sha256sum -c -
          tar -xzf "$RUNNER_TEMP/prometheus.tgz" -C "$RUNNER_TEMP/istio-bin" --strip-components=1 prometheus-3.14.0.linux-amd64/promtool

      - name: Validate isolated operation charts
        run: |
          helm lint charts/mini-commerce-db-dev
          helm lint charts/mini-commerce-recovery --set-string snapshotHandle=snap-0123456789abcdef0
          helm template mini-commerce charts/mini-commerce-db-dev >/dev/null
          helm template mini-commerce charts/mini-commerce-recovery --set-string snapshotHandle=snap-0123456789abcdef0 >/dev/null

      - name: Verify repository governance contract
        run: bash tests/governance-contract.sh docs/github-ruleset.example.json

      - name: Run complete static delivery contracts
        env:
          CHART_CACHE_DIR: ${{ runner.temp }}/locked-charts
        run: bash tests/test-all.sh

      - name: Package chart
        run: scripts/package-chart.sh "$RUNNER_TEMP/chart-package"
