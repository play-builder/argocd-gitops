apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../../bootstrap/prod]
# First run verify-platform-mirror-activation.rb HANDOFF.json prod --verify-live.
# It never activates namespaces: operator admission/traffic approval is still required.
# Explicit opt-in only after controller, TrustRoot and both CIPs are Ready.
# The legacy Application remains the namespace owner during pre-cutover.
patches:
  - target: {kind: ApplicationSet, name: sample-app-prod}
    patch: |-
      - op: add
        path: /spec/template/spec/syncPolicy/managedNamespaceMetadata/labels/policy.sigstore.dev~1include
        value: "true"
