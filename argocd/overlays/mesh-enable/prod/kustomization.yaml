apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../../bootstrap/prod]
# Activate only with Task9 native routing and runtime reinjection approval.
patches:
  - target: {kind: ApplicationSet, name: sample-app-prod}
    patch: |-
      - op: add
        path: /spec/template/spec/syncPolicy/managedNamespaceMetadata/labels/istio.io~1rev
        value: prod-stable
