apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../../bootstrap/dev]
# Activate only with Task9 native routing and runtime reinjection approval.
patches:
  - target: {kind: ApplicationSet, name: sample-app-dev}
    patch: |-
      - op: add
        path: /spec/template/spec/syncPolicy/managedNamespaceMetadata/labels/istio.io~1rev
        value: dev-stable
