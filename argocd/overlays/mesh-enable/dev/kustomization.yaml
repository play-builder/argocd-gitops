apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources: [../../../bootstrap/dev]
# First run verify-platform-mirror-activation.rb HANDOFF.json dev --verify-live.
# It never activates namespaces: operator admission/traffic approval is still required.
# Activate only with Task9 native routing and runtime reinjection approval.
patches:
  - target: {kind: Namespace, name: app-dev}
    patch: |-
      - op: add
        path: /metadata/labels/istio.io~1rev
        value: dev-stable
