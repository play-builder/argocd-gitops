{
  "apiVersion": "external-secrets.io/v1",
  "kind": "ExternalSecret",
  "metadata": {
    "name": "argocd-oidc",
    "namespace": "argocd",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-40"
    }
  },
  "spec": {
    "refreshInterval": "1h",
    "secretStoreRef": {
      "kind": "SecretStore",
      "name": "argocd-secrets"
    },
    "target": {
      "name": "argocd-oidc",
      "creationPolicy": "Owner",
      "deletionPolicy": "Retain",
      "template": {
        "metadata": {
          "labels": {
            "app.kubernetes.io/part-of": "argocd"
          }
        }
      }
    },
    "data": [
      {
        "secretKey": "clientSecret",
        "remoteRef": {
          "key": "REPLACE_FROM_EKS_prod_oidc_sourceArn",
          "property": "clientSecret"
        }
      }
    ]
  }
}
---
{
  "apiVersion": "external-secrets.io/v1",
  "kind": "ExternalSecret",
  "metadata": {
    "name": "argocd-notifications-secret",
    "namespace": "argocd",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-40"
    }
  },
  "spec": {
    "refreshInterval": "1h",
    "secretStoreRef": {
      "kind": "SecretStore",
      "name": "argocd-secrets"
    },
    "target": {
      "name": "argocd-notifications-secret",
      "creationPolicy": "Owner",
      "deletionPolicy": "Retain",
      "template": {
        "metadata": {
          "labels": {
            "app.kubernetes.io/part-of": "argocd"
          }
        }
      }
    },
    "data": [
      {
        "secretKey": "pagerduty-integration-key",
        "remoteRef": {
          "key": "REPLACE_FROM_EKS_prod_notifications_sourceArn",
          "property": "pagerdutyIntegrationKey"
        }
      },
      {
        "secretKey": "slack-token",
        "remoteRef": {
          "key": "REPLACE_FROM_EKS_prod_notifications_sourceArn",
          "property": "slackToken"
        }
      }
    ]
  }
}
---
{
  "apiVersion": "external-secrets.io/v1",
  "kind": "ExternalSecret",
  "metadata": {
    "name": "argocd-repository-credentials",
    "namespace": "argocd",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-40"
    }
  },
  "spec": {
    "refreshInterval": "1h",
    "secretStoreRef": {
      "kind": "SecretStore",
      "name": "argocd-secrets"
    },
    "target": {
      "name": "argocd-repository-credentials",
      "creationPolicy": "Owner",
      "deletionPolicy": "Retain",
      "template": {
        "metadata": {
          "labels": {
            "app.kubernetes.io/part-of": "argocd",
            "argocd.argoproj.io/secret-type": "repo-creds"
          }
        },
        "data": {
          "type": "git",
          "url": "{{ .url }}",
          "username": "{{ .username }}",
          "password": "{{ .password }}"
        }
      }
    },
    "data": [
      {
        "secretKey": "url",
        "remoteRef": {
          "key": "REPLACE_FROM_EKS_prod_repositoryCredentials_sourceArn",
          "property": "url"
        }
      },
      {
        "secretKey": "username",
        "remoteRef": {
          "key": "REPLACE_FROM_EKS_prod_repositoryCredentials_sourceArn",
          "property": "username"
        }
      },
      {
        "secretKey": "password",
        "remoteRef": {
          "key": "REPLACE_FROM_EKS_prod_repositoryCredentials_sourceArn",
          "property": "password"
        }
      }
    ]
  }
}
