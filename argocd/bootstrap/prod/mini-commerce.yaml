---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mini-commerce-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - list:
      elements:
      - environment: prod
        namespace: app-prod
        podSecurityVersion: v1.36
        valuesFile: envs/prod/values.yaml
        statefulValuesFile: envs/prod/stateful-values.yaml
        ownershipValuesFile: envs/prod/pre-cutover-ownership-values.yaml
  template:
    metadata:
      name: mini-commerce-{{ .environment }}
      annotations:
        notifications.argoproj.io/subscribe.on-deployed.slack: platform-deployments
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-prod
      source:
        repoURL: https://github.com/REPLACE_ME/argocd-gitops.git
        targetRevision: main
        path: charts/mini-commerce
        helm:
          releaseName: mini-commerce
          valueFiles:
          - "../../{{ .valuesFile }}"
          - "../../{{ .statefulValuesFile }}"
          - "../../{{ .ownershipValuesFile }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        syncOptions:
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
      ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
        - /spec/replicas
        - "/spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from"
        name: mini-commerce
      - group: argoproj.io
        kind: Rollout
        jsonPointers:
        - /spec/replicas
        - "/spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from"
        name: mini-commerce
      - group: ''
        kind: Service
        jqPathExpressions:
        - .spec.selector["rollouts-pod-template-hash"]
        name: mini-commerce-stable
      - group: networking.istio.io
        kind: VirtualService
        jqPathExpressions:
        - .spec.http[] | select(.name == "primary") | .route[].weight
        name: mini-commerce
      - group: ''
        kind: Service
        jqPathExpressions:
        - .spec.selector["rollouts-pod-template-hash"]
        name: mini-commerce-canary
