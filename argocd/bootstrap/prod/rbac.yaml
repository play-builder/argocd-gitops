apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: mini-commerce-prod
  namespace: argocd
spec:
  roles:
    - name: observer
      description: Read production applications without mutation permission
      groups:
        - playbuilder:prod-observers
      policies:
        - p, proj:mini-commerce-prod:observer, applications, get, mini-commerce-prod/*, allow
    - name: operator
      description: Read, sync, and promote approved production releases
      groups:
        - playbuilder:prod-operators
      policies:
        - p, proj:mini-commerce-prod:operator, applications, get, mini-commerce-prod/*, allow
        - p, proj:mini-commerce-prod:operator, applications, sync, mini-commerce-prod/*, allow
        - p, proj:mini-commerce-prod:operator, applications, action/argoproj.io/Rollout/promote, mini-commerce-prod/*, allow
