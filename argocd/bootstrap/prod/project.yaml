---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-bootstrap-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  description: Bootstrap and Phase A platform handoff resources in the production
    cluster
  sourceRepos:
  # Git signing key distribution is EKS-owned; HEAD precedes strict/seal migration.
  - https://github.com/REPLACE_ME/argocd-gitops.git
  - https://charts.external-secrets.io
  sourceIntegrity:
    git:
      policies:
        - repos: [{url: https://github.com/REPLACE_ME/argocd-gitops.git}]
          gpg: {mode: head, keys: [REPLACE_WITH_APPROVED_GPG_KEY_ID]}
  destinations:
  - server: https://kubernetes.default.svc
    namespace: argocd
  - server: https://kubernetes.default.svc
    namespace: external-secrets
  - server: https://kubernetes.default.svc
    namespace: cosign-system
  clusterResourceWhitelist:
  - group: policy.sigstore.dev
    kind: ClusterImagePolicy
  - group: policy.sigstore.dev
    kind: TrustRoot
  - group: ''
    kind: Namespace
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicy
  - group: admissionregistration.k8s.io
    kind: ValidatingAdmissionPolicyBinding
  namespaceResourceWhitelist:
  - group: argoproj.io
    kind: AppProject
  - group: argoproj.io
    kind: Application
  - group: argoproj.io
    kind: ApplicationSet
  orphanedResources:
    warn: true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: course-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
spec:
  description: Course application resources in app-prod only
  sourceRepos:
  - https://github.com/REPLACE_ME/argocd-gitops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: app-prod
  clusterResourceWhitelist:
  - group: ''
    kind: Namespace
  - group: gateway.networking.k8s.io
    kind: GatewayClass
  - group: gateway.k8s.aws
    kind: LoadBalancerConfiguration
  namespaceResourceWhitelist:
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: Service
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: batch
    kind: Job
  - group: autoscaling
    kind: HorizontalPodAutoscaler
  - group: policy
    kind: PodDisruptionBudget
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: external-secrets.io
    kind: SecretStore
  - group: external-secrets.io
    kind: ExternalSecret
  - group: gateway.networking.k8s.io
    kind: Gateway
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
  - group: gateway.k8s.aws
    kind: TargetGroupConfiguration
  - group: argoproj.io
    kind: Rollout
  - group: argoproj.io
    kind: AnalysisTemplate
  orphanedResources:
    warn: true
---
apiVersion: argoproj.io/v1alpha1
kind: AppProject
metadata:
  name: platform-prod
  namespace: argocd
  annotations:
    notifications.argoproj.io/subscribe.on-sync-failed.pagerdutyv2: platform-prod
    notifications.argoproj.io/subscribe.on-health-degraded.pagerdutyv2: platform-prod
    notifications.argoproj.io/subscribe.on-sync-status-unknown.pagerdutyv2: platform-prod
    argocd.argoproj.io/sync-wave: "-2"
spec:
  sourceIntegrity:
    git:
      policies:
        - repos: [{url: https://github.com/REPLACE_ME/argocd-gitops.git}]
          gpg:
            mode: head
            keys: [REPLACE_WITH_APPROVED_GPG_KEY_ID]
  description: Mini Commerce namespaced workload resources; legacy ownership remains
    in course-prod
  sourceRepos:
  - https://github.com/REPLACE_ME/argocd-gitops.git
  destinations:
  - server: https://kubernetes.default.svc
    namespace: app-prod
  clusterResourceWhitelist: []
  namespaceResourceWhitelist:
  - group: ''
    kind: ServiceAccount
  - group: ''
    kind: Service
  - group: apps
    kind: Deployment
  - group: apps
    kind: StatefulSet
  - group: batch
    kind: Job
  - group: autoscaling
    kind: HorizontalPodAutoscaler
  - group: policy
    kind: PodDisruptionBudget
  - group: networking.k8s.io
    kind: NetworkPolicy
  - group: external-secrets.io
    kind: ExternalSecret
  - group: gateway.networking.k8s.io
    kind: Gateway
  - group: gateway.networking.k8s.io
    kind: HTTPRoute
  - group: gateway.k8s.aws
    kind: TargetGroupConfiguration
  - group: argoproj.io
    kind: Rollout
  - group: argoproj.io
    kind: AnalysisTemplate
  orphanedResources:
    warn: true
  roles:
  - name: observer
    description: Read production applications without mutation permission
    groups:
    - course:prod-observers
    policies:
    - p, proj:platform-prod:observer, applications, get, platform-prod/*, allow
  - name: operator
    description: Read, sync, and promote approved production releases
    groups:
    - course:prod-operators
    policies:
    - p, proj:platform-prod:operator, applications, get, platform-prod/*, allow
    - p, proj:platform-prod:operator, applications, sync, platform-prod/*, allow
    - p, proj:platform-prod:operator, applications, action/argoproj.io/Rollout/promote,
      platform-prod/*, allow
