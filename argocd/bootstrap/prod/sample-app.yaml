apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-app-prod
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - environment: prod
            namespace: app-prod
            valuesFile: envs/prod/values.yaml
            statefulValuesFile: envs/prod/stateful-values.yaml
  template:
    metadata:
      name: "sample-app-{{ .environment }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: course-prod
      source:
        repoURL: https://github.com/REPLACE_ME/argocd-gitops.git
        targetRevision: main
        path: charts/sample-app
        helm:
          releaseName: sample-app
          valueFiles:
            - "../../{{ .valuesFile }}"
            - "../../{{ .statefulValuesFile }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        managedNamespaceMetadata:
          labels:
            gateway-access: "true"
            environment: "{{ .environment }}"
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: ""
          kind: Service
          jqPathExpressions:
            - '.spec.selector["rollouts-pod-template-hash"]'
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - 'select(.metadata.labels["rollouts.argoproj.io/gatewayapi-canary"] == "in-progress") | .spec.rules'
