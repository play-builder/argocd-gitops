apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: mini-commerce-recovery
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  project: mini-commerce-operations-dev
  source:
    repoURL: https://github.com/REPLACE_ME/argocd-gitops.git
    targetRevision: main
    path: charts/mini-commerce-recovery
    helm:
      releaseName: mini-commerce
      valueFiles: [../../envs/dev/recovery-values.yaml]
  destination:
    server: https://kubernetes.default.svc
    namespace: app-recovery
  syncPolicy:
    syncOptions: [ServerSideApply=true]
