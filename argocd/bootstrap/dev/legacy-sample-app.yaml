apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: sample-app-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
    argocd.argoproj.io/sync-options: Prune=confirm
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - environment: dev
            namespace: app-dev
            podSecurityVersion: v1.36
            chaosInjectionEnabled: false
            valuesFile: envs/dev/values.yaml
            statefulValuesFile: envs/dev/stateful-values.yaml
            phaseValuesFile: envs/dev/phase-default-values.yaml
  template:
    metadata:
      name: "sample-app-{{ .environment }}"
      annotations:
        argocd.argoproj.io/sync-options: Prune=confirm
      finalizers: [resources-finalizer.argocd.argoproj.io]
    spec:
      project: course-dev
      source:
        repoURL: https://github.com/REPLACE_ME/argocd-gitops.git
        targetRevision: 2db9276ce171babd87047eb778a3a39cc0585619
        path: charts/sample-app
        helm:
          releaseName: sample-app
          valueFiles: ["../../{{ .valuesFile }}", "../../{{ .statefulValuesFile }}", "../../{{ .phaseValuesFile }}"]
      destination: {server: https://kubernetes.default.svc, namespace: "{{ .namespace }}"}
      syncPolicy:
        automated: {prune: true, selfHeal: true}
        syncOptions: [CreateNamespace=true, ServerSideApply=true, RespectIgnoreDifferences=true]
