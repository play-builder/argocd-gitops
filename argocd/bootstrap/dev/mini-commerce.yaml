apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mini-commerce-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: "0"
spec:
  goTemplate: true
  goTemplateOptions: ["missingkey=error"]
  generators:
    - list:
        elements:
          - environment: dev
            namespace: app-dev
            podSecurityVersion: v1.36
            chaosInjectionEnabled: false
            valuesFile: envs/dev/values.yaml
            statefulValuesFile: envs/dev/stateful-values.yaml
            phaseValuesFile: envs/dev/phase-default-values.yaml
  template:
    metadata:
      name: "mini-commerce-{{ .environment }}"
      finalizers:
        - resources-finalizer.argocd.argoproj.io
    spec:
      project: course-dev
      source:
        repoURL: https://github.com/REPLACE_ME/argocd-gitops.git
        targetRevision: main
        path: charts/mini-commerce
        helm:
          releaseName: mini-commerce
          valueFiles:
            - "../../{{ .valuesFile }}"
            - "../../{{ .statefulValuesFile }}"
            - "../../{{ .phaseValuesFile }}"
      templatePatch: |
        {{- if and (eq .environment "dev") .chaosInjectionEnabled }}
        spec:
          syncPolicy:
            managedNamespaceMetadata:
              annotations:
                chaos-mesh.org/inject: enabled
        {{- end }}
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        managedNamespaceMetadata:
          labels:
            course.playbuilder.io/admission: enabled
            gateway-access: "true"
            environment: "{{ .environment }}"
            pod-security.kubernetes.io/warn: restricted
            pod-security.kubernetes.io/audit: restricted
            pod-security.kubernetes.io/warn-version: "{{ .podSecurityVersion }}"
            pod-security.kubernetes.io/audit-version: "{{ .podSecurityVersion }}"
        syncOptions:
          - CreateNamespace=true
          - ServerSideApply=true
          - RespectIgnoreDifferences=true
      ignoreDifferences:
        - group: apps
          kind: Deployment
          jsonPointers:
            - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
        - group: argoproj.io
          kind: Rollout
          jsonPointers:
            - /spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from
        - group: ""
          kind: Service
          jqPathExpressions:
            - '.spec.selector["rollouts-pod-template-hash"]'
        - group: gateway.networking.k8s.io
          kind: HTTPRoute
          jqPathExpressions:
            - 'select(.metadata.labels["rollouts.argoproj.io/gatewayapi-canary"] == "in-progress") | .spec.rules'
