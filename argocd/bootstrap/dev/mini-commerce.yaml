---
apiVersion: argoproj.io/v1alpha1
kind: ApplicationSet
metadata:
  name: mini-commerce-dev
  namespace: argocd
  annotations:
    argocd.argoproj.io/sync-wave: '0'
spec:
  goTemplate: true
  goTemplateOptions:
  - missingkey=error
  generators:
  - list:
      elements:
      - environment: dev
        namespace: app-dev
        podSecurityVersion: v1.36
        valuesFile: envs/dev/values.yaml
        statefulValuesFile: envs/dev/stateful-values.yaml
        phaseValuesFile: envs/dev/phase-default-values.yaml
        ownershipValuesFile: envs/dev/pre-cutover-ownership-values.yaml
  template:
    metadata:
      name: mini-commerce-{{ .environment }}
      finalizers:
      - resources-finalizer.argocd.argoproj.io
    spec:
      project: platform-dev
      source:
        repoURL: https://github.com/REPLACE_ME/argocd-gitops.git
        targetRevision: main
        path: charts/mini-commerce
        helm:
          releaseName: mini-commerce
          valueFiles:
          - "../../{{ .valuesFile }}"
          - "../../{{ .statefulValuesFile }}"
          - "../../{{ .phaseValuesFile }}"
          - "../../{{ .ownershipValuesFile }}"
      destination:
        server: https://kubernetes.default.svc
        namespace: "{{ .namespace }}"
      syncPolicy:
        automated:
          prune: true
          selfHeal: true
        syncOptions:
        - ServerSideApply=true
        - RespectIgnoreDifferences=true
      ignoreDifferences:
      - group: apps
        kind: Deployment
        jsonPointers:
        - "/spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from"
        name: mini-commerce
      - group: argoproj.io
        kind: Rollout
        jsonPointers:
        - "/spec/template/metadata/annotations/reloader.stakater.com~1last-reloaded-from"
        name: mini-commerce
      - group: ''
        kind: Service
        jqPathExpressions:
        - .spec.selector["rollouts-pod-template-hash"]
        name: mini-commerce-stable
      - group: gateway.networking.k8s.io
        kind: HTTPRoute
        jqPathExpressions:
        - select(.metadata.labels["rollouts.argoproj.io/gatewayapi-canary"] == "in-progress")
          | .spec.rules
        name: mini-commerce
      - group: ''
        kind: Service
        jqPathExpressions:
        - .spec.selector["rollouts-pod-template-hash"]
        name: mini-commerce-canary
