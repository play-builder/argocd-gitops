apiVersion: v1
kind: ServiceAccount
metadata:
  name: mini-commerce-secrets-reader
  namespace: app-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    eks.amazonaws.com/role-arn: REPLACE_FROM_EKS_dev_mini_commerce_secrets_readers_runtime_roleArn
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mini-commerce-secrets
  namespace: app-dev
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_ME_REGION
      auth:
        jwt:
          serviceAccountRef: {name: mini-commerce-secrets-reader}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: mini-commerce-migration-secrets-reader
  namespace: app-dev
  annotations:
    argocd.argoproj.io/sync-wave: "-15"
    eks.amazonaws.com/role-arn: REPLACE_FROM_EKS_dev_mini_commerce_secrets_readers_migration_roleArn
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: mini-commerce-migration-secrets
  namespace: app-dev
  annotations: {argocd.argoproj.io/sync-wave: "-15"}
spec:
  provider:
    aws:
      service: SecretsManager
      region: REPLACE_ME_REGION
      auth:
        jwt:
          serviceAccountRef: {name: mini-commerce-migration-secrets-reader}
