{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "istiod-stable-dev",
    "namespace": "argocd",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-30",
      "argocd.argoproj.io/sync-options": "Prune=confirm"
    }
  },
  "spec": {
    "project": "platform-mesh-dev",
    "source": {
      "repoURL": "https://blob.istio.io/istio-release/charts",
      "chart": "istiod",
      "targetRevision": "1.30.4",
      "helm": {
        "releaseName": "istiod-stable",
        "valuesObject": {
          "revision": "1-30-4",
          "global": {
            "proxy": {"image": "REPLACE_FROM_EKS_PLATFORM_ISTIO_PROXY_ECR@sha256:43b6aeab7428470d3d0ea6b6f0bc217e5b36df2b279bba337643df48590226d9"},
            "proxy_init": {"image": "REPLACE_FROM_EKS_PLATFORM_ISTIO_PROXY_ECR@sha256:43b6aeab7428470d3d0ea6b6f0bc217e5b36df2b279bba337643df48590226d9"}
          },
          "revisionTags": [
            "dev-stable"
          ],
          "meshConfig": {
            "accessLogFile": "/dev/stdout",
            "enablePrometheusMerge": true,
            "defaultConfig": {
              "holdApplicationUntilProxyStarts": true
            }
          },
          "pilot": {
            "autoscaleMin": 1
          }
        }
      }
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "istio-system"
    },
    "syncPolicy": {
      "syncOptions": [
        "ServerSideApply=true"
      ]
    }
  }
}
