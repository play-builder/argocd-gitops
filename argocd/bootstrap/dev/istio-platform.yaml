{
  "apiVersion": "argoproj.io/v1alpha1",
  "kind": "Application",
  "metadata": {
    "name": "istio-ingress-stable-dev",
    "namespace": "argocd",
    "annotations": {
      "argocd.argoproj.io/sync-wave": "-25",
      "argocd.argoproj.io/sync-options": "Prune=confirm"
    }
  },
  "spec": {
    "project": "platform-mesh-dev",
    "source": {
      "repoURL": "https://blob.istio.io/istio-release/charts",
      "chart": "gateway",
      "targetRevision": "1.30.4",
      "helm": {
        "releaseName": "istio-ingress-stable",
        "valuesObject": {
          "revision": "1-30-4",
          "labels": {
            "istio": "ingressgateway-stable"
          },
          "service": {
            "type": "ClusterIP",
            "ports": [
              {
                "name": "status-port",
                "port": 15021,
                "targetPort": 15021
              },
              {
                "name": "http2",
                "port": 80,
                "targetPort": 8080
              }
            ]
          },
          "autoscaling": {
            "minReplicas": 1,
            "maxReplicas": 5
          },
          "serviceAccount": {
            "name": "istio-ingress-stable"
          }
        }
      }
    },
    "destination": {
      "server": "https://kubernetes.default.svc",
      "namespace": "istio-system"
    },
    "syncPolicy": {
      "syncOptions": [
        "ServerSideApply=true"
      ]
    }
  }
}
