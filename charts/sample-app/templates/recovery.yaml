{{- if or .Values.snapshot.captureEnabled .Values.recovery.restoreEnabled }}
{{- if and .Values.snapshot.captureEnabled .Values.recovery.restoreEnabled }}
{{- fail "snapshot.captureEnabled and recovery.restoreEnabled are mutually exclusive" }}
{{- end }}
{{- if eq .Values.recovery.source.pvcName .Values.recovery.pvcName }}
{{- fail "recovery PVC equals source PVC" }}
{{- end }}
{{- if .Values.snapshot.captureEnabled }}
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: {{ .Values.recovery.source.snapshotName }}
  namespace: {{ .Values.recovery.source.namespace }}
  labels:
    course.playbuilder.io/cleanup-scope: {{ .Values.recovery.cleanupLabel | quote }}
  annotations:
    course.playbuilder.io/source-pvc: {{ .Values.recovery.source.pvcName | quote }}
    argocd.argoproj.io/sync-options: Prune=confirm
    argocd.argoproj.io/sync-wave: "-2"
spec:
  volumeSnapshotClassName: {{ .Values.recovery.snapshotClassName }}
  source:
    persistentVolumeClaimName: {{ .Values.recovery.source.pvcName }}
{{- else }}
{{- $roleArn := required "recovery.readerRoleArn is required for recovery" .Values.recovery.readerRoleArn }}
{{- $databaseRemoteKey := required "externalSecrets.database.remoteSecretName is required for recovery" .Values.externalSecrets.database.remoteSecretName }}
{{- if ne .Values.recovery.snapshotClassName "course-ebs-snapshots" }}
{{- fail "recovery.snapshotClassName must be course-ebs-snapshots" }}
{{- end }}
{{- if ne .Values.recovery.snapshotDriver "ebs.csi.aws.com" }}
{{- fail "recovery.snapshotDriver must be ebs.csi.aws.com" }}
{{- end }}
{{- if not (regexMatch "^snap-[0-9a-f]{17}$" .Values.recovery.snapshotHandle) }}
{{- fail "recovery.snapshotHandle must be a validated EBS snapshot ID" }}
{{- end }}
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshotContent
metadata:
  name: {{ .Values.recovery.snapshotContentName }}
  labels:
    course.playbuilder.io/cleanup-scope: {{ .Values.recovery.cleanupLabel | quote }}
  annotations:
    course.playbuilder.io/source-pvc: {{ .Values.recovery.source.pvcName | quote }}
    course.playbuilder.io/snapshot-handle: {{ .Values.recovery.snapshotHandle | quote }}
    argocd.argoproj.io/sync-options: Prune=confirm
    argocd.argoproj.io/sync-wave: "-2"
spec:
  deletionPolicy: Retain
  driver: {{ .Values.recovery.snapshotDriver }}
  source:
    snapshotHandle: {{ .Values.recovery.snapshotHandle | quote }}
  sourceVolumeMode: Filesystem
  volumeSnapshotRef:
    name: {{ .Values.recovery.snapshotName }}
    namespace: {{ .Values.recovery.namespace }}
---
apiVersion: snapshot.storage.k8s.io/v1
kind: VolumeSnapshot
metadata:
  name: {{ .Values.recovery.snapshotName }}
  namespace: {{ .Values.recovery.namespace }}
  labels:
    course.playbuilder.io/cleanup-scope: {{ .Values.recovery.cleanupLabel | quote }}
  annotations:
    course.playbuilder.io/source-pvc: {{ .Values.recovery.source.pvcName | quote }}
    course.playbuilder.io/snapshot-handle: {{ .Values.recovery.snapshotHandle | quote }}
    argocd.argoproj.io/sync-options: Prune=confirm
    argocd.argoproj.io/sync-wave: "-2"
spec:
  volumeSnapshotClassName: {{ .Values.recovery.snapshotClassName }}
  source:
    volumeSnapshotContentName: {{ .Values.recovery.snapshotContentName }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: {{ .Values.recovery.pvcName }}
  namespace: {{ .Values.recovery.namespace }}
  labels:
    course.playbuilder.io/cleanup-scope: {{ .Values.recovery.cleanupLabel | quote }}
  annotations:
    course.playbuilder.io/source-pvc: {{ .Values.recovery.source.pvcName | quote }}
    course.playbuilder.io/snapshot-handle: {{ .Values.recovery.snapshotHandle | quote }}
    argocd.argoproj.io/sync-options: Prune=confirm
    argocd.argoproj.io/sync-wave: "-2"
spec:
  accessModes: [ReadWriteOnce]
  storageClassName: {{ .Values.database.storageClassName }}
  dataSource:
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    name: {{ .Values.recovery.snapshotName }}
  resources:
    requests:
      storage: {{ .Values.database.storageSize }}
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app-recovery-secret-reader
  namespace: {{ .Values.recovery.namespace }}
  annotations:
    eks.amazonaws.com/role-arn: {{ $roleArn | quote }}
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: true
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: sample-app-recovery-postgresql
  namespace: {{ .Values.recovery.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
automountServiceAccountToken: false
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager-recovery
  namespace: {{ .Values.recovery.namespace }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: sample-app-recovery-secret-reader
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sample-app-db-recovery
  namespace: {{ .Values.recovery.namespace }}
  labels:
    course.playbuilder.io/cleanup-scope: {{ .Values.recovery.cleanupLabel | quote }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager-recovery
  target:
    name: {{ include "sample-app.recoveryDatabaseSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DB_HOST
      remoteRef: {key: {{ $databaseRemoteKey }}, property: DB_HOST}
    - secretKey: DB_PORT
      remoteRef: {key: {{ $databaseRemoteKey }}, property: DB_PORT}
    - secretKey: DB_NAME
      remoteRef: {key: {{ $databaseRemoteKey }}, property: DB_NAME}
    - secretKey: DB_USER
      remoteRef: {key: {{ $databaseRemoteKey }}, property: DB_USER}
    - secretKey: DB_PASSWORD
      remoteRef: {key: {{ $databaseRemoteKey }}, property: DB_PASSWORD}
---
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: {{ include "sample-app.databaseFullname" . }}-recovery
  namespace: {{ .Values.recovery.namespace }}
  labels:
    course.playbuilder.io/cleanup-scope: {{ .Values.recovery.cleanupLabel | quote }}
    app.kubernetes.io/component: recovery
  annotations:
    argocd.argoproj.io/sync-wave: "-2"
    course.playbuilder.io/source-pvc: {{ .Values.recovery.source.pvcName | quote }}
    course.playbuilder.io/snapshot-handle: {{ .Values.recovery.snapshotHandle | quote }}
spec:
  serviceName: {{ include "sample-app.databaseFullname" . }}-recovery
  replicas: 1
  selector:
    matchLabels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/component: recovery}
  template:
    metadata:
      labels: {app.kubernetes.io/name: postgresql, app.kubernetes.io/component: recovery}
    spec:
      serviceAccountName: sample-app-recovery-postgresql
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 70
        runAsGroup: 70
        fsGroup: 70
        seccompProfile: {type: RuntimeDefault}
      containers:
        - name: postgresql
          image: {{ include "sample-app.databaseImage" . }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities: {drop: [ALL]}
          env:
            - {name: POSTGRES_DB, valueFrom: {secretKeyRef: {name: sample-app-db-recovery, key: DB_NAME}}}
            - {name: POSTGRES_USER, valueFrom: {secretKeyRef: {name: sample-app-db-recovery, key: DB_USER}}}
            - {name: POSTGRES_PASSWORD, valueFrom: {secretKeyRef: {name: sample-app-db-recovery, key: DB_PASSWORD}}}
          ports: [{name: postgresql, containerPort: 5432, protocol: TCP}]
          volumeMounts: [{name: data, mountPath: /var/lib/postgresql/data}]
      volumes: [{name: data, persistentVolumeClaim: {claimName: {{ .Values.recovery.pvcName }}}}]
{{- end }}
{{- end }}
