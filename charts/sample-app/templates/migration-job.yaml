{{- if and .Values.database.enabled .Values.database.migration.enabled (not .Values.maintenance.writersStopped) }}
{{- $secretName := include "sample-app.databaseSecretName" . }}
{{- $migrationTarget := required "database.migration.target is required when migration is enabled" .Values.database.migration.target }}
{{- $rollbackConfigMapName := "" }}
{{- if .Values.database.migration.rollbackCandidates.enabled }}
{{- $rollbackConfigMapName = required "database.migration.rollbackCandidates.configMapName is required when rollback candidate handoff is enabled" .Values.database.migration.rollbackCandidates.configMapName }}
{{- end }}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "sample-app.fullname" . }}-migration
  namespace: {{ include "sample-app.namespace" . }}
  annotations:
    argocd.argoproj.io/hook: Sync
    argocd.argoproj.io/hook-delete-policy: BeforeHookCreation
    argocd.argoproj.io/sync-wave: "-1"
  labels:
    app.kubernetes.io/name: sample-app-migration
    app.kubernetes.io/instance: {{ .Release.Name }}
    app.kubernetes.io/part-of: sample-app
    app.kubernetes.io/component: migration
spec:
  backoffLimit: {{ .Values.database.migration.backoffLimit }}
  activeDeadlineSeconds: {{ .Values.database.migration.activeDeadlineSeconds }}
  template:
    metadata:
      labels:
        app.kubernetes.io/name: sample-app-migration
        app.kubernetes.io/instance: {{ .Release.Name }}
        app.kubernetes.io/part-of: sample-app
        app.kubernetes.io/component: migration
    spec:
      restartPolicy: Never
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1001
        runAsGroup: 1001
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: migrate
          image: {{ include "sample-app.migrationImage" . }}
          imagePullPolicy: {{ .Values.database.migrationImage.pullPolicy }}
          command: ["node", "scripts/migrate.mjs"]
          args: ["--target", {{ $migrationTarget | quote }}]
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          volumeMounts:
            - name: tmp
              mountPath: /tmp
            {{- if .Values.database.migration.rollbackCandidates.enabled }}
            - name: rollback-candidates
              mountPath: /var/run/course-evidence
              readOnly: true
            {{- end }}
          env:
            - name: DATABASE_ENABLED
              value: "true"
            - name: DB_HOST
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_HOST
            - name: DB_PORT
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_PORT
            - name: DB_NAME
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_NAME
            - name: DB_USER
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_USER
            - name: DB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: {{ $secretName }}
                  key: DB_PASSWORD
            - name: DB_SSL
              value: "false"
            {{- if .Values.database.migration.rollbackCandidates.enabled }}
            - name: ROLLBACK_CANDIDATES_FILE
              value: /var/run/course-evidence/rollback-candidates.json
            - name: ROLLBACK_EXPECTED_ENVIRONMENT
              valueFrom:
                configMapKeyRef:
                  name: {{ $rollbackConfigMapName }}
                  key: environment
            - name: ROLLBACK_EXPECTED_REGION
              valueFrom:
                configMapKeyRef:
                  name: {{ $rollbackConfigMapName }}
                  key: region
            - name: ROLLBACK_EXPECTED_CLUSTER_ARN
              valueFrom:
                configMapKeyRef:
                  name: {{ $rollbackConfigMapName }}
                  key: clusterArn
            - name: ROLLBACK_EXPECTED_ROLLOUT_NAME
              valueFrom:
                configMapKeyRef:
                  name: {{ $rollbackConfigMapName }}
                  key: rolloutName
            - name: ROLLBACK_EXPECTED_GITOPS_REVISION
              valueFrom:
                configMapKeyRef:
                  name: {{ $rollbackConfigMapName }}
                  key: gitopsRevision
            - name: ROLLBACK_EXPECTED_SOURCE_EVIDENCE_DIGEST
              valueFrom:
                configMapKeyRef:
                  name: {{ $rollbackConfigMapName }}
                  key: sourceEvidenceDigest
            {{- end }}
      volumes:
        - name: tmp
          emptyDir: {}
        {{- if .Values.database.migration.rollbackCandidates.enabled }}
        - name: rollback-candidates
          configMap:
            name: {{ $rollbackConfigMapName }}
            defaultMode: 0444
            items:
              - key: rollback-candidates.json
                path: rollback-candidates.json
        {{- end }}
{{- end }}
