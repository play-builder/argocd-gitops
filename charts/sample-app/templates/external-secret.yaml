{{- if .Values.externalSecrets.enabled }}
{{- $roleArn := required "externalSecrets.readerRoleArn is required when External Secrets is enabled" .Values.externalSecrets.readerRoleArn }}
{{- $remoteKey := required "externalSecrets.remoteSecretName is required when External Secrets is enabled" .Values.externalSecrets.remoteSecretName }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.readerServiceAccount }}
  namespace: {{ include "sample-app.namespace" . }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    eks.amazonaws.com/role-arn: {{ $roleArn | quote }}
automountServiceAccountToken: true
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: {{ include "sample-app.namespace" . }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.readerServiceAccount }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "sample-app.fullname" . }}
  namespace: {{ include "sample-app.namespace" . }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: {{ .Values.externalSecrets.targetSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  dataFrom:
    - extract:
        key: {{ $remoteKey }}
{{- end }}
