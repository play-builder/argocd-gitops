{{- if .Values.chaos.enabled }}
{{- if ne .Values.chaos.environment "dev" }}
{{- fail "chaos is allowed only in dev" }}
{{- end }}
{{- if eq (len .Values.chaos.targetLabels) 0 }}
{{- fail "chaos.targetLabels must select an application workload" }}
{{- end }}
{{- if not (regexMatch "^[1-9][0-9]*[sm]$" .Values.chaos.maximumDuration) }}
{{- fail "chaos.maximumDuration must be a positive s/m duration" }}
{{- end }}
{{- $duration := .Values.chaos.maximumDuration }}
{{- $number := int (trimSuffix "m" (trimSuffix "s" $duration)) }}
{{- $unit := "s" }}
{{- if hasSuffix "m" $duration }}{{- $unit = "m" }}{{- end }}
{{- if or (and (eq $unit "m") (gt $number 5)) (and (eq $unit "s") (gt $number 300)) }}
{{- fail "chaos.maximumDuration must not exceed 300 seconds" }}
{{- end }}
{{- $namespace := include "sample-app.namespace" . }}
apiVersion: chaos-mesh.org/v1alpha1
kind: PodChaos
metadata:
  name: {{ include "sample-app.fullname" . }}-pod-fault
  namespace: {{ $namespace }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
    course.playbuilder.io/incident: INC-RES-01
spec:
  action: pod-kill
  mode: one
  selector:
    namespaces: [{{ $namespace | quote }}]
    labelSelectors:
      {{- toYaml .Values.chaos.targetLabels | nindent 6 }}
  duration: {{ $duration | quote }}
---
apiVersion: chaos-mesh.org/v1alpha1
kind: NetworkChaos
metadata:
  name: {{ include "sample-app.fullname" . }}-network-fault
  namespace: {{ $namespace }}
  labels:
    {{- include "sample-app.labels" . | nindent 4 }}
    course.playbuilder.io/incident: INC-RES-02
spec:
  action: delay
  mode: one
  selector:
    namespaces: [{{ $namespace | quote }}]
    labelSelectors:
      {{- toYaml .Values.chaos.targetLabels | nindent 6 }}
  delay:
    latency: 100ms
    correlation: 100
    jitter: 10ms
  direction: to
  duration: {{ $duration | quote }}
{{- end }}
