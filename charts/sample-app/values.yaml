nameOverride: ""
fullnameOverride: ""

environment: dev

namespace:
  create: true
  name: app-dev
  labels:
    gateway-access: "true"

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

workload:
  kind: Deployment
  revisionHistoryLimit: 3

replicaCount: 2

deployment:
  maxSurge: 1
  maxUnavailable: 0

serviceAccount:
  create: true
  name: sample-app

containerPort: 3000

app:
  failureRate: "0"
  latencyMs: "0"
  readyDelayMs: "0"
  shutdownDelayMs: "5000"
  secretKeys: "DB_HOST,DB_PASSWORD,API_KEY"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

terminationGracePeriodSeconds: 30

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

service:
  port: 80

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

externalSecrets:
  enabled: false
  awsRegion: ""
  readerServiceAccount: external-secrets-reader
  readerRoleArn: ""
  refreshInterval: 1h
  runtime:
    remoteSecretName: ""
    targetSecretName: sample-app-runtime
  database:
    remoteSecretName: ""
    targetSecretName: sample-app-db

# Lab-only PostgreSQL. Ch01~Ch14 remains Stateless because this is false by default.
database:
  enabled: false
  host: ""
  port: 5432
  name: commerce
  user: commerce
  storageClassName: course-gp3
  storageSize: 5Gi
  image:
    repository: docker.io/library/postgres
    digest: sha256:ef257d85f76e48da1c64832459b59fcaba1a4dac97bf5d7450c77753542eee94
    pullPolicy: IfNotPresent
  migrationImage:
    repository: ""
    digest: ""
    pullPolicy: IfNotPresent
  migration:
    enabled: true
    backoffLimit: 3
    activeDeadlineSeconds: 600
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: 500m
      memory: 512Mi

gateway:
  enabled: true
  className: aws-alb
  controllerName: gateway.k8s.aws/alb
  name: sample-app
  scheme: internet-facing
  sourceRanges: []
  hostname: ""
  certificateArn: ""
  httpEnabled: true
  httpsEnabled: false

rollout:
  rollbackWindow:
    revisions: 0
  analysis:
    enabled: false
    prometheusAddress: ""
    awsRegion: ""
    interval: 30s
    count: 5
    failureLimit: 3
    consecutiveErrorLimit: 5
    minimumRequestRate: 0.1
    successRateThreshold: 99
  canary:
    manualPromotion: false
    steps:
      - setWeight: 5
      - pause:
          duration: 1m
      - analysis:
          templates:
            - templateName: sample-app-success-rate
          args:
            - name: latest-hash
              valueFrom:
                podTemplateHashValue: Latest
      - setWeight: 20
      - pause:
          duration: 1m
      - setWeight: 50
      - pause:
          duration: 2m
      - setWeight: 100

telemetry:
  enabled: false
  serviceName: sample-app
  otlpEndpoint: ""
  otlpProtocol: http/protobuf

networkPolicy:
  enabled: false
  gateway:
    sourceCidrs: []
  dns:
    namespaceLabels:
      kubernetes.io/metadata.name: kube-system
    podLabels:
      k8s-app: kube-dns
  telemetry:
    namespaceLabels: {}
    podLabels: {}
    port: 4318

# Task 6 expands this interface with snapshot and restore identity fields.
recovery:
  restoreEnabled: false
  namespace: app-recovery
  snapshotClassName: ebs.csi.aws.com
  snapshotDriver: ebs.csi.aws.com
  snapshotContentName: sample-app-postgresql-recovery-content
  snapshotName: sample-app-postgresql-recovery-snapshot
  pvcName: sample-app-postgresql-recovery
  snapshotHandle: ""
  cleanupLabel: recovery
  source:
    namespace: app-dev
    pvcName: data-sample-app-postgresql-0
    snapshotName: sample-app-postgresql-snapshot
snapshot:
  captureEnabled: false
maintenance:
  writersStopped: false

chaos:
  enabled: false
  environment: dev
  maximumDuration: 5m
  targetLabels:
    app.kubernetes.io/name: sample-app
    app.kubernetes.io/component: application

courseCleanup:
  workloadsDisabled: false
