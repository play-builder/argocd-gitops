nameOverride: ""
fullnameOverride: ""

environment: dev

namespace:
  create: true
  name: app-dev
  labels:
    gateway-access: "true"

image:
  repository: ""
  digest: ""
  pullPolicy: IfNotPresent

workload:
  kind: Deployment

replicaCount: 2

deployment:
  maxSurge: 1
  maxUnavailable: 0

serviceAccount:
  create: true
  name: sample-app

containerPort: 3000

app:
  failureRate: "0"
  latencyMs: "0"
  readyDelayMs: "0"
  shutdownDelayMs: "5000"
  secretKeys: "DB_HOST,DB_PASSWORD,API_KEY"

resources:
  requests:
    cpu: 100m
    memory: 128Mi
  limits:
    cpu: 500m
    memory: 256Mi

terminationGracePeriodSeconds: 30

probes:
  liveness:
    path: /healthz
    initialDelaySeconds: 10
    periodSeconds: 10
    failureThreshold: 3
  readiness:
    path: /readyz
    initialDelaySeconds: 3
    periodSeconds: 5
    failureThreshold: 3

service:
  port: 80

autoscaling:
  enabled: false
  minReplicas: 2
  maxReplicas: 6
  targetCPUUtilizationPercentage: 70

podDisruptionBudget:
  enabled: false
  minAvailable: 1

topologySpread:
  enabled: true
  maxSkew: 1
  whenUnsatisfiable: ScheduleAnyway

externalSecrets:
  enabled: false
  awsRegion: ""
  readerServiceAccount: external-secrets-reader
  readerRoleArn: ""
  remoteSecretName: ""
  targetSecretName: sample-app-secrets
  refreshInterval: 1h

gateway:
  enabled: true
  className: aws-alb
  controllerName: gateway.k8s.aws/alb
  name: sample-app
  scheme: internet-facing
  sourceRanges: []
  hostname: ""
  certificateArn: ""
  httpEnabled: true
  httpsEnabled: false

rollout:
  rollbackWindow:
    revisions: 0
  analysis:
    enabled: false
    prometheusAddress: ""
    awsRegion: ""
    interval: 30s
    count: 5
    failureLimit: 3
    consecutiveErrorLimit: 5
    minimumRequestRate: 0.1
    successRateThreshold: 99
  canary:
    manualPromotion: false
    steps:
      - setWeight: 5
      - pause:
          duration: 1m
      - analysis:
          templates:
            - templateName: sample-app-success-rate
          args:
            - name: latest-hash
              valueFrom:
                podTemplateHashValue: Latest
      - setWeight: 20
      - pause:
          duration: 1m
      - setWeight: 50
      - pause:
          duration: 2m
      - setWeight: 100

networkPolicy:
  enabled: false
