{{- if and (eq .Values.workload.kind "Rollout") .Values.rollout.analysis.enabled }}
{{- $address := required "rollout.analysis.prometheusAddress is required when analysis is enabled" .Values.rollout.analysis.prometheusAddress }}
apiVersion: argoproj.io/v1alpha1
kind: AnalysisTemplate
metadata:
  name: mini-commerce-success-rate
  namespace: {{ include "mini-commerce.namespace" . }}
  labels:
    {{- include "mini-commerce.labels" . | nindent 4 }}
spec:
  args:
    - name: latest-hash
  metrics:
    - name: request-rate
      initialDelay: 30s
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      consecutiveErrorLimit: {{ .Values.rollout.analysis.consecutiveErrorLimit }}
      successCondition: result[0] >= {{ .Values.rollout.analysis.minimumRequestRate }}
      provider:
        prometheus:
          address: {{ $address | quote }}
          authentication:
            sigv4:
              region: {{ .Values.rollout.analysis.awsRegion | quote }}
          query: |
            sum(rate(http_requests_total{
              app="mini-commerce",
              namespace="{{ include "mini-commerce.namespace" . }}",
              rollouts_pod_template_hash="{{`{{args.latest-hash}}`}}"
            }[2m])) or vector(0)
    - name: success-rate
      initialDelay: 30s
      interval: {{ .Values.rollout.analysis.interval }}
      count: {{ .Values.rollout.analysis.count }}
      failureLimit: {{ .Values.rollout.analysis.failureLimit }}
      consecutiveErrorLimit: {{ .Values.rollout.analysis.consecutiveErrorLimit }}
      successCondition: result[0] >= {{ .Values.rollout.analysis.successRateThreshold }}
      provider:
        prometheus:
          address: {{ $address | quote }}
          authentication:
            sigv4:
              region: {{ .Values.rollout.analysis.awsRegion | quote }}
          query: |
            (1 - (
              (sum(rate(http_requests_total{
                app="mini-commerce",
                namespace="{{ include "mini-commerce.namespace" . }}",
                rollouts_pod_template_hash="{{`{{args.latest-hash}}`}}",
                status=~"5.."
              }[2m])) or vector(0))
              /
              clamp_min((sum(rate(http_requests_total{
                app="mini-commerce",
                namespace="{{ include "mini-commerce.namespace" . }}",
                rollouts_pod_template_hash="{{`{{args.latest-hash}}`}}"
              }[2m])) or vector(0)), 0.001)
            )) * 100
{{- end }}
