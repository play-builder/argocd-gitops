{{- if .Values.gateway.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: GatewayClass
metadata:
  name: {{ .Values.gateway.className }}
  labels:
    {{- include "mini-commerce.labels" . | nindent 4 }}
spec:
  controllerName: {{ .Values.gateway.controllerName }}
---
apiVersion: gateway.k8s.aws/v1
kind: LoadBalancerConfiguration
metadata:
  name: {{ include "mini-commerce.fullname" . }}
  namespace: {{ include "mini-commerce.namespace" . }}
  labels:
    {{- include "mini-commerce.labels" . | nindent 4 }}
spec:
  scheme: {{ .Values.gateway.scheme }}
  {{- with .Values.gateway.sourceRanges }}
  sourceRanges:
    {{- toYaml . | nindent 4 }}
  {{- end }}
  tags:
    Environment: {{ .Values.environment | quote }}
    ManagedBy: aws-load-balancer-controller
  {{- if and .Values.gateway.httpsEnabled .Values.gateway.certificateArn }}
  listenerConfigurations:
    - protocolPort: HTTPS:443
      defaultCertificate: {{ .Values.gateway.certificateArn | quote }}
  {{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: {{ .Values.gateway.name }}
  namespace: {{ include "mini-commerce.namespace" . }}
  labels:
    {{- include "mini-commerce.labels" . | nindent 4 }}
spec:
  gatewayClassName: {{ .Values.gateway.className }}
  infrastructure:
    parametersRef:
      group: gateway.k8s.aws
      kind: LoadBalancerConfiguration
      name: {{ include "mini-commerce.fullname" . }}
  listeners:
    {{- if .Values.gateway.httpEnabled }}
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
    {{- if .Values.gateway.httpsEnabled }}
    - name: https
      protocol: HTTPS
      port: 443
      allowedRoutes:
        namespaces:
          from: Same
    {{- end }}
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: {{ include "mini-commerce.fullname" . }}-stable
  namespace: {{ include "mini-commerce.namespace" . }}
  labels:
    {{- include "mini-commerce.labels" . | nindent 4 }}
spec:
  targetReference:
    name: {{ include "mini-commerce.fullname" . }}-stable
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckProtocol: HTTP
      healthCheckPort: "3001"
      healthCheckPath: /readyz
      matcher:
        httpCode: "200"
{{- if eq .Values.workload.kind "Rollout" }}
---
apiVersion: gateway.k8s.aws/v1
kind: TargetGroupConfiguration
metadata:
  name: {{ include "mini-commerce.fullname" . }}-canary
  namespace: {{ include "mini-commerce.namespace" . }}
  labels:
    {{- include "mini-commerce.labels" . | nindent 4 }}
spec:
  targetReference:
    name: {{ include "mini-commerce.fullname" . }}-canary
  defaultConfiguration:
    targetType: ip
    healthCheckConfig:
      healthCheckProtocol: HTTP
      healthCheckPort: "3001"
      healthCheckPath: /readyz
      matcher:
        httpCode: "200"
{{- end }}
---
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ include "mini-commerce.fullname" . }}
  namespace: {{ include "mini-commerce.namespace" . }}
  labels:
    {{- include "mini-commerce.labels" . | nindent 4 }}
  {{- if .Values.gateway.hostname }}
  annotations:
    external-dns.alpha.kubernetes.io/hostname: {{ .Values.gateway.hostname | quote }}
  {{- end }}
spec:
  parentRefs:
    {{- if .Values.gateway.httpEnabled }}
    - name: {{ .Values.gateway.name }}
      sectionName: http
    {{- end }}
    {{- if .Values.gateway.httpsEnabled }}
    - name: {{ .Values.gateway.name }}
      sectionName: https
    {{- end }}
  {{- if .Values.gateway.hostname }}
  hostnames:
    - {{ .Values.gateway.hostname | quote }}
  {{- end }}
  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /
      backendRefs:
        - name: {{ include "mini-commerce.fullname" . }}-stable
          port: {{ .Values.service.port }}
          weight: 100
        {{- if eq .Values.workload.kind "Rollout" }}
        - name: {{ include "mini-commerce.fullname" . }}-canary
          port: {{ .Values.service.port }}
          weight: 0
        {{- end }}
{{- end }}
