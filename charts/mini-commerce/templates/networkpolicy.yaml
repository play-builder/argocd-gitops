{{- if .Values.database.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: mini-commerce-database-egress
  namespace: {{ include "mini-commerce.namespace" . }}
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: mini-commerce
    matchExpressions:
      - key: app.kubernetes.io/component
        operator: In
        values: [application, migration]
  policyTypes: [Egress]
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports: [{protocol: UDP, port: 53}, {protocol: TCP, port: 53}]
    {{- if eq .Values.environment "prod" }}
    {{- range .Values.database.allowedCidrs }}
    {{- include "mini-commerce.validateCIDR" (dict "cidr" . "field" "database.allowedCidrs" "privateOnly" true) }}
    - to:
        - ipBlock:
            cidr: {{ . | quote }}
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
    {{- else }}
    - to:
        - podSelector:
            matchLabels:
              app.kubernetes.io/name: postgresql
              app.kubernetes.io/component: database
      ports: [{protocol: TCP, port: 5432}]
    {{- end }}
{{- end }}
