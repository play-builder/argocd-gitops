{{- if .Values.externalSecrets.enabled }}
{{- $roleArn := required "externalSecrets.readerRoleArn is required when External Secrets is enabled" .Values.externalSecrets.readerRoleArn }}
{{- $runtimeRemoteKey := required "externalSecrets.runtime.remoteSecretName is required when External Secrets is enabled" .Values.externalSecrets.runtime.remoteSecretName }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: {{ .Values.externalSecrets.readerServiceAccount }}
  namespace: {{ include "mini-commerce.namespace" . }}
  labels:
    {{- include "mini-commerce.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
    eks.amazonaws.com/role-arn: {{ $roleArn | quote }}
automountServiceAccountToken: true
---
apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: {{ include "mini-commerce.namespace" . }}
  labels:
    {{- include "mini-commerce.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  provider:
    aws:
      service: SecretsManager
      region: {{ .Values.externalSecrets.awsRegion }}
      auth:
        jwt:
          serviceAccountRef:
            name: {{ .Values.externalSecrets.readerServiceAccount }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mini-commerce.runtimeSecretName" . }}
  namespace: {{ include "mini-commerce.namespace" . }}
  labels:
    {{- include "mini-commerce.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: {{ include "mini-commerce.runtimeSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: API_KEY
      remoteRef:
        key: {{ $runtimeRemoteKey }}
        property: API_KEY
{{- if .Values.database.enabled }}
{{- $databaseRemoteKey := required "externalSecrets.database.remoteSecretName is required when database is enabled" .Values.externalSecrets.database.remoteSecretName }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ include "mini-commerce.databaseSecretName" . }}
  namespace: {{ include "mini-commerce.namespace" . }}
  labels:
    {{- include "mini-commerce.labels" . | nindent 4 }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ .Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: aws-secrets-manager
  target:
    name: {{ include "mini-commerce.databaseSecretName" . }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    - secretKey: DB_HOST
      remoteRef:
        key: {{ $databaseRemoteKey }}
        property: DB_HOST
    - secretKey: DB_PORT
      remoteRef:
        key: {{ $databaseRemoteKey }}
        property: DB_PORT
    - secretKey: DB_NAME
      remoteRef:
        key: {{ $databaseRemoteKey }}
        property: DB_NAME
    - secretKey: DB_USER
      remoteRef:
        key: {{ $databaseRemoteKey }}
        property: DB_USER
    - secretKey: DB_PASSWORD
      remoteRef:
        key: {{ $databaseRemoteKey }}
        property: DB_PASSWORD
{{- end }}
{{- end }}
