{{- if .Values.externalSecrets.enabled }}
{{- range $kind := list "runtime" "database" "migration" }}
{{- if or (eq $kind "runtime") $.Values.database.enabled }}
{{- $input := index $.Values.externalSecrets $kind }}
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: {{ $input.targetSecretName }}
  namespace: {{ include "mini-commerce.namespace" $ }}
  annotations:
    argocd.argoproj.io/sync-wave: "-3"
spec:
  refreshInterval: {{ $.Values.externalSecrets.refreshInterval }}
  secretStoreRef:
    kind: SecretStore
    name: {{ if eq $kind "migration" }}mini-commerce-migration-secrets{{ else }}mini-commerce-secrets{{ end }}
  target:
    name: {{ $input.targetSecretName }}
    creationPolicy: Owner
    deletionPolicy: Retain
  data:
    {{- range $key := (ternary (list "API_KEY") (list "DB_HOST" "DB_PORT" "DB_NAME" "DB_USER" "DB_PASSWORD") (eq $kind "runtime")) }}
    - secretKey: {{ $key }}
      remoteRef:
        key: {{ required (printf "externalSecrets.%s.remoteSecretName required" $kind) $input.remoteSecretName | quote }}
        property: {{ $key }}
    {{- end }}
{{- end }}
{{- end }}
{{- end }}
