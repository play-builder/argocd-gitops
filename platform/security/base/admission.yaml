apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicy
metadata:
  name: mini-commerce-workload-security
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  failurePolicy: Fail
  matchConstraints:
    matchPolicy: Equivalent
    resourceRules:
      - apiGroups: [""]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["pods"]
      - apiGroups: ["apps"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["deployments", "statefulsets"]
      - apiGroups: ["batch"]
        apiVersions: ["v1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["jobs"]
      - apiGroups: ["argoproj.io"]
        apiVersions: ["v1alpha1"]
        operations: ["CREATE", "UPDATE"]
        resources: ["rollouts"]
  variables:
    - name: podSpec
      expression: >-
        object.kind == 'Pod' ? object.spec : object.spec.template.spec
  validations:
    - expression: >-
        !has(variables.podSpec.volumes) || variables.podSpec.volumes.all(v, !has(v.hostPath))
      message: hostPath is prohibited.
    - expression: >-
        variables.podSpec.containers.all(c, !has(c.securityContext) || !has(c.securityContext.privileged) || !c.securityContext.privileged)
      message: Privileged containers are prohibited.
    - expression: >-
        variables.podSpec.containers.all(container,
          container.image.matches('^.+@sha256:[0-9a-f]{64}$')) &&
        (!has(variables.podSpec.initContainers) ||
          variables.podSpec.initContainers.all(container,
            container.image.matches('^.+@sha256:[0-9a-f]{64}$')))
      message: Every workload image must use an immutable sha256 digest.
      reason: Invalid
    - expression: >-
        has(variables.podSpec.securityContext) &&
        variables.podSpec.securityContext.runAsNonRoot == true &&
        has(variables.podSpec.securityContext.seccompProfile) &&
        variables.podSpec.securityContext.seccompProfile.type == 'RuntimeDefault'
      message: Workloads must run as non-root with RuntimeDefault seccomp.
      reason: Invalid
    - expression: >-
        variables.podSpec.containers.all(container,
          has(container.securityContext) &&
          container.securityContext.allowPrivilegeEscalation == false &&
          has(container.securityContext.capabilities) &&
          has(container.securityContext.capabilities.drop) &&
          container.securityContext.capabilities.drop.exists(capability, capability == 'ALL')) &&
        (!has(variables.podSpec.initContainers) ||
          variables.podSpec.initContainers.all(container,
            has(container.securityContext) &&
            container.securityContext.allowPrivilegeEscalation == false &&
            has(container.securityContext.capabilities) &&
            has(container.securityContext.capabilities.drop) &&
            container.securityContext.capabilities.drop.exists(capability, capability == 'ALL')))
      message: Containers must disable privilege escalation and drop all capabilities.
      reason: Invalid
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingAdmissionPolicyBinding
metadata:
  name: mini-commerce-workload-security
  annotations:
    argocd.argoproj.io/sync-wave: "-10"
spec:
  policyName: mini-commerce-workload-security
  validationActions:
    - Deny
  matchResources:
    namespaceSelector:
      matchLabels:
        operations.mini-commerce.io/security: enforced
