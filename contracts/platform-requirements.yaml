schemaVersion: course.platform-requirements/v1
ownerRepository: EKS-infra
argoConfigMap: argocd-cm
argoHealthCustomizations:
  - id: external-secret-ready-health/v1
    apiGroup: external-secrets.io
    kind: ExternalSecret
    healthyWhen: Ready=True at observedGeneration
    requiredBeforeSyncWave: -2
    implementationOwner: EKS-infra
  - id: volume-snapshot-ready-health/v1
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    healthyWhen: readyToUse=true with a bound content name
    requiredBeforeSyncWave: -2
    implementationOwner: EKS-infra
recoveryOutputs:
  volumeSnapshotClassName: volume_snapshot_class_name
  snapshotDriver: snapshot_driver
  recoveryReaderRoleArn: recovery_db_secret_reader_role_arn
telemetryOutputs:
  xrayEnabled: adot_xray_enabled
  endpoint: otlp_http_traces_endpoint
  protocol: otlp_traces_protocol
  port: otlp_http_port
  path: otlp_http_traces_path
prometheusLabels:
  - namespace
  - pod
  - app
  - rollouts_pod_template_hash
