schemaVersion: course.platform-requirements/v1
ownerRepository: EKS-infra
applicationAttestation:
  repositoryId: 1352247019
  issuer: https://token.actions.githubusercontent.com
  trustedEcrOutput: mini_commerce_ecr_repository_url
  cutoverEvidenceSchema: course.rename-cutover/v1
  predicates:
    - https://slsa.dev/provenance/v1
    - https://spdx.dev/Document/v2.3
  preCutoverWorkflows:
    - play-builder/cicd-course-sample-app/.github/workflows/ci.yml@refs/heads/main
    - play-builder/mini-commerce/.github/workflows/ci.yml@refs/heads/main
  postCutoverWorkflow: play-builder/mini-commerce/.github/workflows/ci.yml@refs/heads/main
argoConfigMap: argocd-cm
argoHealthCustomizations:
  - id: external-secret-ready-health/v1
    apiGroup: external-secrets.io
    kind: ExternalSecret
    healthyWhen: Ready=True at observedGeneration
    requiredBeforeSyncWave: -2
    implementationOwner: EKS-infra
  - id: volume-snapshot-ready-health/v1
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    healthyWhen: readyToUse=true with a bound content name
    requiredBeforeSyncWave: -2
    implementationOwner: EKS-infra
