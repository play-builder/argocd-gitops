schemaVersion: platform.requirements/v2
owners:
  argocdGlobal: EKS-infra
  sigstoreController: EKS-infra
  applicationDesiredState: argocd-gitops
  applicationAttestation: cicd-course-sample-app
  argocdSecretStore: EKS-infra
  argocdExternalSecrets: argocd-gitops
argocd:
  namespace: argocd
  oidcGroupsClaim: groups
  defaultRole: role:authenticated
  anonymousAccess: false
  breakGlassRole: platform-break-glass
  prodSync: manual
  devSync: automated-prune-self-heal
  chartVersion: 10.4.3
  controllerVersion: v3.5.2
  prodRequiresHA: true
  bootstrapMode: public
  secretStoreRef: {kind: SecretStore, name: argocd-secrets}
  handoffRenderer: scripts/render-platform-credentials.rb
  sourceOutput: argocd
sigstoreController:
  sourceOutput: sigstore_controller
  namespace: cosign-system
  chartVersion: 0.10.5
  appVersion: 0.13.1
ownerRepository: EKS-infra
applicationAttestation:
  repositoryId: 1352247019
  issuer: https://token.actions.githubusercontent.com
  trustedEcrOutput: mini_commerce_ecr_repository_url
  cutoverEvidenceSchema: course.rename-cutover/v1
  predicates:
    - https://slsa.dev/provenance/v1
    - https://spdx.dev/Document/v2.3
  preCutoverWorkflows:
    - play-builder/cicd-course-sample-app/.github/workflows/ci.yml@refs/heads/main
    - play-builder/mini-commerce/.github/workflows/ci.yml@refs/heads/main
  postCutoverWorkflow: play-builder/mini-commerce/.github/workflows/ci.yml@refs/heads/main
argoConfigMap: argocd-cm
argoHealthCustomizations:
  - id: external-secret-ready-health/v1
    apiGroup: external-secrets.io
    kind: ExternalSecret
    healthyWhen: Ready=True at observedGeneration
    requiredBeforeSyncWave: -2
    implementationOwner: EKS-infra
  - id: volume-snapshot-ready-health/v1
    apiGroup: snapshot.storage.k8s.io
    kind: VolumeSnapshot
    healthyWhen: readyToUse=true with a bound content name
    requiredBeforeSyncWave: -2
    implementationOwner: EKS-infra
